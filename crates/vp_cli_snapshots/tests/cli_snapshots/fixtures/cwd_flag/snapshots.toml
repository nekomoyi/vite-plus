[[case]]
name = "cwd_flag"
vp = ["local", "global"]
comment = """
The global -C flag runs any command as if vp was started in the directory:
pack and run behave byte-identically to the cd forms, a missing directory
errors, and the positional keeps upstream tsdown entry semantics
(rfcs/cwd-flag.md).
"""
steps = [
  { argv = ["vp", "-C", "packages/hello", "pack"], comment = "-C packs the package from the workspace root" },
  { argv = ["vpt", "list-dir", "packages/hello/dist"], comment = "output lands in the target package" },
  { argv = ["vpt", "rm", "-rf", "packages/hello/dist"], comment = "reset so both forms produce identical output" },
  { argv = ["vp", "pack"], cwd = "packages/hello", comment = "the cd form is equivalent" },
  { argv = ["vp", "-C", "packages/hello", "run", "where"], comment = "-C applies to vp run as well" },
  { argv = ["vp", "run", "where"], cwd = "packages/hello", comment = "equivalent cd form for run" },
  { argv = ["vpr", "-C", "packages/hello", "where"], comment = "vpr -C <dir> <task> consumes the flag and runs the task in <dir> (global vpr shim and local bin/vpr)" },
  { argv = ["vpr", "where"], cwd = "packages/hello", comment = "equivalent cd form for vpr" },
  { argv = ["vpr", "-C"], comment = "bare vpr -C reports the missing directory argument instead of running a task named -C", continue-on-failure = true },
  { argv = ["vp", "-C", "packages/missing", "build"], comment = "missing directory errors", continue-on-failure = true },
  { argv = ["vp", "pack", "packages/hello"], comment = "positional stays a tsdown entry resolved from the invocation directory" },
  { argv = ["vpt", "list-dir", "dist"], comment = "upstream semantics: output lands at the invocation directory" },
  { argv = ["vp", "run", "where:hello"], comment = "a script whose command starts with vp -C runs verbatim and honors the directory" },
]

# Regression guard for the -C direct-exec PWD gap: a command run through
# `env exec` (the node/npm/npx shim dispatch, not the JS-delegation path)
# must observe `process.env.PWD` synced to the -C target, exactly like the
# cd form, so `-C dir` is equivalent to `cd dir`. Before the fix, -C only
# changed the process cwd and the child inherited the original PWD.
[[case]]
name = "cwd_flag_pwd_env_exec"
vp = ["global"]
# PWD is a POSIX convention: no Windows shell exports it, and vp's PWD sync
# is unix-only, so both forms report false there. Skip rather than encode a
# Windows-specific snapshot for semantics that do not exist on the platform.
skip-platforms = ["windows"]
comment = """
`vp -C <dir> env exec <tool>` must give the spawned tool the same PWD as
`cd <dir> && vp env exec <tool>`. The boolean keeps the assertion path- and
redaction-independent.
"""
steps = [
  { argv = ["vp", "-C", "packages/hello", "env", "exec", "node", "-e", "console.log('PWD matches cwd: ' + (process.env.PWD === process.cwd()))"], comment = "-C form: the direct-exec child should see PWD synced to the target" },
  { argv = ["vp", "env", "exec", "node", "-e", "console.log('PWD matches cwd: ' + (process.env.PWD === process.cwd()))"], cwd = "packages/hello", comment = "equivalent cd form (baseline: true)" },
]

[[case]]
name = "cwd_flag_completion"
vp = ["global"]
skip-platforms = ["windows"]
comment = """
Dynamic shell completion for -C suggests directories when completing the flag
value and resolves cwd-dependent completions (such as `vp run` tasks) from the
target directory once the cursor moves past -C.
"""
steps = [
  { argv = ["vpt", "write-file", "node_modules/vite-plus/package.json", "{\"name\":\"vite-plus\",\"version\":\"0.0.0\"}\n"], snapshot = false },
  { argv = ["vpt", "write-file", "node_modules/vite-plus/dist/bin.js", "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); for (const [k, v] of Object.entries(pkg.scripts || {})) console.log(`${k}: ${v}`);\n"], snapshot = false },
  { argv = ["vp", "--", "vp", "-C", "pack"], envs = [["VP_COMPLETE", "fish"]], comment = "completing -C suggests directories from the current working directory" },
  { argv = ["vp", "--", "vp", "run", "w"], envs = [["VP_COMPLETE", "fish"]], comment = "without -C, run completion resolves tasks from the workspace root" },
  { argv = ["vp", "--", "vp", "-C", "packages/hello", "run", "w"], envs = [["VP_COMPLETE", "fish"]], comment = "-C <dir> switches directory before resolving run task completions" },
  { argv = ["vp", "--", "vp", "-C=packages/hello", "run", "w"], envs = [["VP_COMPLETE", "fish"]], comment = "-C=<dir> inline form also switches directory for completion" },
  { argv = ["vp", "--", "vp", "-Cpackages/hello", "run", "w"], envs = [["VP_COMPLETE", "fish"]], comment = "-C<dir> attached form also switches directory for completion" },
  { argv = ["vp", "--", "vp", "run", "w"], cwd = "packages/hello", envs = [["VP_COMPLETE", "fish"]], comment = "equivalent cd form for run completion" },
]

[[case]]
name = "cwd_flag_shell_completion"
vp = ["global"]
skip-platforms = ["windows"]
requires = ["bash", "zsh", "fish"]
comment = """
Shell completion adapters for Bash, Zsh, and Fish expand shell-local variables
in -C <dir>, support `vpr -C` in Bash, and preserve single-quoted literal paths
in Fish.
"""
steps = [
  { argv = ["vpt", "write-file", "node_modules/vite-plus/package.json", "{\"name\":\"vite-plus\",\"version\":\"0.0.0\"}\n"], snapshot = false },
  { argv = ["vpt", "write-file", "node_modules/vite-plus/dist/bin.js", "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); for (const [k, v] of Object.entries(pkg.scripts || {})) console.log(`${k}: ${v}`);\n"], snapshot = false },
  { argv = ["vpt", "write-file", "~/literal/package.json", "{\"name\":\"literal-tilde\",\"scripts\":{\"where:tilde\":\"echo tilde\"}}\n"], snapshot = false },
  { argv = ["bash", "--noprofile", "--norc", "-c", "eval \"$(VP_COMPLETE=bash vp)\"; PROJECT=packages/hello; COMP_WORDS=(vpr -C '\"$PROJECT\"' w); COMP_CWORD=3; COMP_LINE='vpr -C \"$PROJECT\" w'; COMP_POINT=${#COMP_LINE}; _clap_complete_vpr; printf 'bash vpr -C $PROJECT: %s\\n' \"${COMPREPLY[*]}\"; COMP_WORDS=(vpr -C pack); COMP_CWORD=2; COMP_LINE='vpr -C pack'; COMP_POINT=${#COMP_LINE}; _clap_complete_vpr; printf 'bash vpr -C <dir>: %s\\n' \"${COMPREPLY[*]}\""], comment = "Bash expands unexported local $PROJECT and completes both vpr -C <dir> and tasks in <dir>" },
  { argv = ["zsh", "-f", "-c", "compdef() { : }; eval \"$(VP_COMPLETE=zsh vp)\"; _describe() { local -a arr; eval \"arr=(\\\"\\${${3}[@]}\\\")\"; print -r -- \"zsh vp -C \\$PROJECT: ${arr[*]}\"; }; PROJECT=packages/hello; words=(vp -C '\"$PROJECT\"' run w); CURRENT=5; _clap_dynamic_completer_vp"], comment = "Zsh expands unexported local $PROJECT before invoking vp dynamic completion" },
  { argv = ["fish", "--no-config", "-c", "VP_COMPLETE=fish vp | source; set -l PROJECT packages/hello; printf 'fish vp -C $PROJECT: %s\\n' (complete -C 'vp -C \"$PROJECT\" run w'); printf 'fish vp -C literal tilde: %s\\n' (complete -C \"vp -C '~/literal' run w\")"], comment = "Fish expands local $PROJECT and preserves single-quoted '~/literal' without home expansion" },
]
